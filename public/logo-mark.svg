<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Jivanaut Helix-J Logo">
  <defs>
    <linearGradient id="jMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="jDarkBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2219" />
      <stop offset="100%" stop-color="#07130E" />
    </linearGradient>
  </defs>
  <!-- Base badge -->
  <rect width="64" height="64" rx="14" fill="url(#jDarkBack)" stroke="#24493A" stroke-width="1.5" />
  
  <!-- DNA Base pair rungs (horizontal connecting rungs) -->
  <line x1="28" y1="18" x2="42" y2="18" stroke="#A9C2B5" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="24" y1="26" x2="42" y2="26" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
  <line x1="26" y1="34" x2="42" y2="34" stroke="#A9C2B5" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Secondary subtle helix weave -->
  <path d="M26 12 C26 17 38 20 42 26 C46 32 38 36 30 38" 
        stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Primary Helix-J strand (forming the solid upright trunk and classic J terminal hook) -->
  <path d="M42 12 V34 C42 42.5 35 48 25 48 C16.5 48 13 41.5 13 36 C13 32 16.5 30 19.5 32 C22 33.7 22.5 36.5 25 37 C28.5 37.5 32 35 32 30.5 V12" 
        fill="none" stroke="url(#jMintGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Base terminal nodes representing nucleotide base molecules -->
  <circle cx="42" cy="12" r="3.5" fill="#EAF5EE" stroke="#07130E" stroke-width="1.5" />
  <circle cx="32" cy="12" r="2.5" fill="#34D399" />
  <circle cx="16" cy="35" r="2" fill="#6EE7B7" />
</svg>
